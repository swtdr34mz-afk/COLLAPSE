# COLLAPSE build settings (fm1-base tools/build.py). The pixel type of the screens: X0X_FONTSET=terminus in the
# environment (the workflow sets it; for a local build: X0X_FONTSET=terminus python3 fm1-base/tools/build.py . --host)
name = "collapse"                 # the build's file names: collapse-0.1.fwsc, build/host/collapse_host
title = "COLLAPSE"                # the name people see (firmware hubs)
id_prefix = "FM-1_579"            # package identity: dev FM-1_57900, releases FM-1_579 + XXYYZZ
usb_manufacturer = "swtdr34mz"
usb_product = "COLLAPSE FM-1"     # the USB name (the MIDI port in a DAW)
o2 = ["dsp/engine.c", "dsp/patterns.c"]   # the sound engine and the patterns, at -O2
include = ["dsp"]
vendored = ["fm1-base/"]          # fm1-base is a submodule inside the app: its own checks are its own
words = "words.tsv"
ble = false
backup = true                     # backup and restore of the settings
cpu2 = true                       # the second core renders GLITCH, PERC, BASS
cpu2_fallback = true              # if it fails on an FM-1: one core on, no restart
tagline = "A physics drum machine: six bodies on springs, every hit pushes the web"
repo = "https://github.com/swtdr34mz-afk/COLLAPSE"
licence = "MPL-2.0"
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hügelton Instruments)."
author = "swtdr34mz"
description = "A physics drum machine inspired by Anukari: six instruments that are masses on springs, simulated at the sample rate (a drum head, snare wires, a cymbal plate, a bouncing ball, a modal resonator, a string). Every hit pushes the web: the bodies shake each other, hits bounce and drift off the grid, tracks of different lengths run against each other. MASS and CHAOS macros, per instrument FM, GRAIN, FILTER and CHAOS, PITCH as time dilation, a stutter. PERF mode: 16 pads (COLLAPSE, ZERO-G, BLACK HOLE, FREEZE, REWIND, repeats, tape stop ...) and MUTATE on the knobs (ERODE, MORPH, ENTANGLE, RIPPLE). Eight patterns, MIDI clock in. A 90s cyberpunk skin."
tags = ["drum-machine", "synth"]
install = "https://github.com/swtdr34mz-afk/COLLAPSE/releases"
screenshot = "site/img/screen-main.png"
